<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>수면의 무게</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: wide game column (max 1000px). Big pixel-art stage with dialog/overlay layers, status strip above, control deck below; ranking only on the title screen. Single committed night palette. */
:root{
  --night:#0c1026; --deck:#151b3d; --deck2:#1c2452; --line:#2e3a78; --ink:#eef0ff; --mute:#a3acdc;
  --lamp:#ffc76b; --lampInk:#2b1a00; --phone:#ee86dd; --moon:#9ab9ff; --good:#66dbab; --bad:#ff7a7a; --gold:#ffe07a;
  --display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px 28px}
#app{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#app.wide{max-width:min(1400px,calc((100vh - 40px) * 16 / 9))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;min-width:0}
.strip .tag{padding:3px 8px;border-radius:6px;background:var(--deck);border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.strip .tag b{font-family:var(--mono);font-weight:600}
.mbar{width:58px;height:7px;background:#0a0e22;border-radius:3px;overflow:hidden;display:inline-block}
.mbar i{display:block;height:100%}
.strip .buff{color:var(--good);border-color:#2f6b57}.strip .debuff{color:var(--bad);border-color:#7a3340}.strip .card{color:var(--lamp);border-color:#7a5a24}.strip .mis{color:var(--gold);border-color:#7a6a24}
.stage{position:relative;border-radius:12px;overflow:hidden;border:3px solid #2a3470;background:#000;box-shadow:0 0 0 5px #0a0d20}
canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;user-select:none;-webkit-user-select:none}
.dlg{position:absolute;left:2%;right:2%;bottom:3%;background:rgba(10,12,32,.93);border:2px solid #c9cff7;border-radius:6px;padding:12px 16px;min-height:70px;cursor:pointer;box-shadow:0 0 0 2px #0a0c20}
.dlg .who{position:absolute;top:-14px;left:12px;font-family:var(--display);font-size:15px;padding:0 9px;background:#c9cff7;color:#141a3a;border-radius:4px}
.dlg .who.mong{background:#d8ccff}.dlg .who.seo{background:#ffc9a8}.dlg .who.t{background:#a8e6c9}
.dlg .txt{font-size:clamp(14px,2.1vw,19px);line-height:1.5;min-height:44px}
.dlg .nxt{position:absolute;right:12px;bottom:5px;font-size:11px;color:var(--mute);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,10,28,.8);padding:12px;text-align:center}
.overlay.clear{background:transparent;justify-content:flex-end;padding-bottom:5%}
.overlay h2{font-size:clamp(20px,3.4vw,32px);color:var(--gold)}
.overlay p{margin:0;max-width:620px}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(100%,760px)}
.pick{background:#151b44;border:2px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:10px;row-gap:3px;align-content:start;min-width:0}
.pick>*:not(.pi){grid-column:2;min-width:0}
.pick .pi{grid-column:1;grid-row:1/span 4;width:56px;height:56px;image-rendering:pixelated;border-radius:8px;background:#0b0f2a;border:1px solid var(--line)}
.vol{display:flex;align-items:center;gap:6px}.vol input{width:80px;accent-color:#ffc76b}
.pick:hover,.pick:focus-visible{border-color:var(--lamp)}
.pick b{font-family:var(--display);font-weight:400;font-size:clamp(15px,2vw,19px)}
.pick .g{font-size:11px;font-family:var(--mono);letter-spacing:1px}
.pick small{color:var(--mute);font-size:12px;line-height:1.4}
.pick .bad{color:var(--bad)}
.g-epic{color:#ff8ad8}.g-rare{color:#7fd6ff}.g-com{color:#c9cff7}.g-deb{color:var(--bad)}
.ox{display:flex;gap:14px}
.ox button{width:clamp(80px,14vw,130px);height:clamp(60px,10vw,96px);border-radius:12px;border:3px solid;font-family:var(--display);font-size:clamp(32px,6vw,56px);background:#151b44}
.ox .o{border-color:#66dbab;color:#66dbab}.ox .x{border-color:#ff7a7a;color:#ff7a7a}
.deck{background:var(--deck);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:22px}h3{font-size:18px}
.mute{color:var(--mute)}.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{background:var(--lamp);color:var(--lampInk);border:0;border-radius:8px;padding:12px 16px;font-family:var(--display);font-size:19px;box-shadow:0 4px 0 #b07a22}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b07a22}
.btn.ghost{background:var(--deck2);color:var(--ink);box-shadow:0 4px 0 #0a0e26;border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 150px}
.choice{text-align:left;font-family:var(--body);font-size:15px}
.choice small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.tl{height:36px;border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--line)}
.tl div{display:flex;align-items:center;justify-content:center;font-size:13px;font-family:var(--display);transition:flex-basis .2s;white-space:nowrap;overflow:hidden}
.ss{background:var(--lamp);color:var(--lampInk)}.sl{background:var(--phone);color:#2b0827}.sz{background:#3a5bb0;color:#fff}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute)}
.ctrl{display:grid;grid-template-columns:1fr auto 64px auto;gap:8px;align-items:center}
.step{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--deck2);font-size:20px}
.val{text-align:center}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:#10163a;border-radius:20px;padding:6px 11px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pv{background:#0f1536;border-radius:8px;padding:7px;text-align:center}
.pv b{display:block;font-family:var(--mono);font-size:17px}.pv span{font-size:11.5px;color:var(--mute)}
.memo{border-left:3px solid var(--moon);padding:6px 10px;background:#10163a;font-size:13px;color:#d3dbff}
.memo.warn{border-left-color:var(--bad)}.memo.mis{border-left-color:var(--gold);color:#fff3c4}
.itemcard{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#10163a;text-align:left}
.itemcard b{font-family:var(--display);font-weight:400;font-size:17px}
.cmp{display:grid;grid-template-columns:88px 1fr 52px;gap:8px;align-items:center;font-size:13px}
.cmp .mbar{width:100%;height:10px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tools{display:flex;gap:6px;flex:none}
.snd{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--mute)}
.rank{width:100%;border-collapse:collapse;font-size:13.5px}
.rank th{font-weight:400;color:var(--mute);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);font-size:12px}
.rank td{padding:5px 6px;border-bottom:1px solid #222a5a}
.rank td.n{font-family:var(--mono);text-align:right}
.rank tr.me td{color:var(--gold)}
.rank .pos{font-family:var(--display);font-size:16px;width:30px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.gal span{font-size:12.5px;padding:6px 8px;border-radius:6px;border:1px dashed var(--line);color:var(--mute)}
.gal span.on{border-style:solid;border-color:var(--gold);color:var(--gold)}
input[type=text]{background:#0f1536;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;font:inherit;width:100%}
.tabs{display:flex;gap:6px}
.tabs button{border:1px solid var(--line);background:#10163a;border-radius:6px;padding:4px 10px;font-size:13px}
.tabs button[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:11.5px}
.cal span{padding:4px 2px;border-radius:5px;text-align:center;background:#10163a;border:1px solid var(--line);color:var(--mute);line-height:1.25}
.cal span.now{border-color:var(--lamp);color:var(--lamp)}.cal span.done{opacity:.45}.cal span b{display:block;font-family:var(--display);font-weight:400;font-size:13px}
[hidden]{display:none!important}
.survey{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:10px;border:2px solid var(--gold);background:#2a2614}
body,button,.deck,.overlay{touch-action:manipulation}
.stage{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.skipd{position:absolute;right:10px;top:-14px;font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid #c9cff7;background:#141a3a;color:#c9cff7}
@media (max-width:700px){
 .dlg{position:relative;left:auto;right:auto;bottom:auto;margin:16px 8px 8px;min-height:0;padding:12px 12px 18px}
 .dlg .txt{font-size:15.5px;min-height:0}
 .overlay{position:relative;inset:auto;background:#0f1438;padding:14px 10px;gap:8px}
 .overlay.clear{background:#0f1438;padding-bottom:14px}
 .overlay h2{font-size:21px}
 .picks{grid-template-columns:1fr;gap:8px}.pick{padding:8px 10px}.pick small{font-size:11.5px}
 .strip .card{display:none}.strip{font-size:11.5px;gap:4px}.strip .tag{padding:2px 6px}.mbar{width:40px}
 #big{display:none}
 .toprow{flex-direction:column-reverse;align-items:stretch;gap:6px}.tools{justify-content:flex-end}.vol input{width:96px}
 .stage{border-width:2px;box-shadow:none;background:#0f1438}
 .deck{padding:12px}
 .btn{font-size:18px;padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<main id="app">
  <div class="toprow"><div class="strip" id="strip"></div><div class="tools"><button class="snd" id="big" type="button">크게 보기</button><label class="snd vol" for="vol">음량 <input type="range" id="vol" min="0" max="100" value="80" aria-label="음량"></label><button class="snd" id="snd" type="button">소리 끔</button></div></div>
  <div class="stage" id="stage"><canvas id="cv" width="256" height="144" aria-label="게임 화면"></canvas>
    <div class="dlg" id="dlg" hidden role="button" tabindex="0" aria-label="대사 넘기기"><span class="who" id="who"></span><div class="txt" id="txt"></div><span class="nxt">▼ 탭</span><button class="skipd" id="skipd" type="button">대화 건너뛰기</button></div>
    <div class="overlay" id="ov" hidden></div>
  </div>
  <section class="deck" id="deck"></section>
  <section class="deck" id="board"></section>
</main>
<script>
/* =================== AUDIO: chiptune BGM + SFX =================== */
const AU={vol:1.6,ctx:null,on:false,master:null,bgm:null,sfx:null,noise:null,track:null,step:0,next:0,timer:null};
function auInit(){if(AU.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.vol;const cmp=AU.ctx.createDynamicsCompressor();cmp.threshold.value=-14;cmp.ratio.value=4;AU.master.connect(cmp);cmp.connect(AU.ctx.destination);
  AU.bgm=AU.ctx.createGain();AU.bgm.gain.value=.75;AU.bgm.connect(AU.master);AU.sfx=AU.ctx.createGain();AU.sfx.gain.value=1.4;AU.sfx.connect(AU.master);
  const n=AU.ctx.createBuffer(1,AU.ctx.sampleRate*.5,AU.ctx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=n;
  AU.timer=setInterval(sched,25)}catch(e){AU.ctx=null}}
function setSound(on){AU.on=on;if(on){auInit();try{AU.ctx&&AU.ctx.resume()}catch(e){}}if(AU.master)AU.master.gain.value=on?AU.vol:0;document.getElementById('snd').textContent=on?'소리 켬':'소리 끔'}
document.getElementById('snd').onclick=()=>setSound(!AU.on);
try{const v=localStorage.getItem('sow_vol');if(v!=null){document.getElementById('vol').value=v;AU.vol=v/50}}catch(e){}
document.getElementById('vol').oninput=e=>{AU.vol=e.target.value/50;try{localStorage.setItem('sow_vol',e.target.value)}catch(_){}if(AU.master&&AU.on)AU.master.gain.value=AU.vol;if(!AU.on&&+e.target.value>0)setSound(true)};
const NOTE=n=>{if(!n||n==='.')return 0;const m=n.match(/^([A-G])(#?)(\d)$/);const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*2**(((+m[3]+1)*12+base-69)/12)};
const seq=s=>s.trim().split(/\s+/).map(NOTE);
const TRACKS={
 title:{bpm:76,lw:'triangle',bw:'sine',lead:seq('E5 . G5 . C6 . B5 . A5 . G5 . E5 . . . D5 . E5 . G5 . A5 . G5 . E5 . D5 . . . C5 . E5 . G5 . C6 . D6 . C6 . B5 . . . A5 . G5 . E5 . F5 . E5 . D5 . C5 . . .'),bass:seq('C3 . . . G3 . . . A3 . . . E3 . . . F3 . . . C3 . . . G3 . . . G3 . . . C3 . . . G3 . . . A3 . . . E3 . . . F3 . . . G3 . . . C3 . . . . . . .'),drum:''},
 day:{bpm:118,lw:'square',bw:'triangle',lead:seq('C5 E5 G5 E5 A5 . G5 . F5 A5 C6 A5 G5 . E5 . D5 F5 A5 F5 G5 . E5 . C5 D5 E5 G5 E5 . . . C5 E5 G5 E5 A5 . G5 . F5 A5 C6 D6 C6 . A5 . G5 . B5 . D6 . B5 . C6 . . . . . . .'),bass:seq('C3 . C3 . A2 . A2 . F2 . F2 . C3 . C3 . D3 . D3 . G2 . G2 . C3 . C3 . G2 . G2 . C3 . C3 . A2 . A2 . F2 . F2 . F2 . F2 . G2 . G2 . G2 . G2 . C3 . C3 . C3 . . .'),drum:'k.h.s.h.k.h.s.h.k.h.s.h.k.h.s.hk'},
 night:{bpm:62,lw:'sine',bw:'sine',lead:seq('A4 . C5 . E5 . . . D5 . C5 . B4 . . . A4 . C5 . E5 . A5 . G5 . . . . . . . F4 . A4 . C5 . . . B4 . A4 . G4 . . . E4 . G4 . B4 . D5 . C5 . . . . . . .'),bass:seq('A2 . . . . . . . F2 . . . . . . . A2 . . . . . . . E2 . . . . . . . F2 . . . . . . . G2 . . . . . . . C3 . . . . . . . E2 . . . . . . .'),drum:''},
 battle:{bpm:146,lw:'square',bw:'sawtooth',lead:seq('A4 A4 C5 A4 E5 . D5 C5 A4 . G4 . A4 . . . A4 A4 C5 A4 F5 . E5 D5 C5 . B4 . C5 . . . F4 F4 A4 F4 C5 . B4 A4 G4 . E4 . G4 . A4 . E5 . D5 . C5 . B4 . G#4 . B4 . E5 . . .'),bass:seq('A2 . A2 A3 A2 . A2 A3 A2 . A2 A3 A2 . G2 G3 F2 . F2 F3 F2 . F2 F3 F2 . F2 F3 F2 . G2 G3 D2 . D2 D3 D2 . D2 D3 E2 . E2 E3 E2 . E2 E3 A2 . A2 A3 A2 . A2 A3 E2 . E2 E3 E2 . E2 E3'),drum:'k.h.s.hkk.h.s.h.k.h.s.hkk.hss.h'},
 boss:{bpm:160,lw:'square',bw:'sawtooth',lead:seq('D5 . D5 F5 . D5 G5 . F5 . E5 . C#5 . D5 . D5 . D5 F5 . D5 A5 . G5 . F5 . E5 . F5 . A#4 . A#4 D5 . A#4 F5 . E5 . D5 . C#5 . A4 . D5 . F5 . A5 . G5 . F5 . E5 . C#5 . A4 .'),bass:seq('D2 D3 D2 D3 D2 D3 D2 D3 D2 D3 D2 D3 A1 A2 A1 A2 D2 D3 D2 D3 D2 D3 D2 D3 D2 D3 D2 D3 A1 A2 A1 A2 A#1 A#2 A#1 A#2 A#1 A#2 A#1 A#2 A1 A2 A1 A2 A1 A2 A1 A2 D2 D3 D2 D3 D2 D3 D2 D3 A1 A2 A1 A2 C#2 C#3 A1 A2'),drum:'kkhsk.hskkhsk.hskkhsk.hskkhskshs'},
 mini:{bpm:132,lw:'square',bw:'triangle',lead:seq('G5 . E5 G5 C6 . G5 . A5 . F5 A5 D6 . A5 . G5 . E5 G5 C6 . E6 . D6 . B5 . G5 . . .'),bass:seq('C3 . G2 . C3 . G2 . F2 . C3 . F2 . C3 . C3 . G2 . C3 . G2 . G2 . D3 . G2 . . .'),drum:'k.hsk.hsk.hsk.hs'},
 end:{bpm:84,lw:'triangle',bw:'sine',lead:seq('C5 . E5 . G5 . C6 . B5 . G5 . A5 . . . F5 . A5 . C6 . F6 . E6 . C6 . D6 . . . E6 . D6 . C6 . B5 . A5 . G5 . E5 . F5 . G5 . . . . . C6 . . . . . . .'),bass:seq('C3 . . . G2 . . . F2 . . . F2 . . . F2 . . . C3 . . . G2 . . . G2 . . . A2 . . . E2 . . . F2 . . . G2 . . . C3 . . . . . . . . . . . . . . .'),drum:''}};
function bgm(name){if(AU.track===name)return;AU.track=name;AU.step=0;if(AU.ctx)AU.next=AU.ctx.currentTime+.08}
function tone(f,t,d,type,vol,dest,slide){const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02)}
function noiseHit(t,d,vol,hp,dest){const s=AU.ctx.createBufferSource();s.buffer=AU.noise;const f=AU.ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AU.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+d+.02)}
function sched(){if(!AU.ctx||!AU.on||!AU.track)return;const tr=TRACKS[AU.track];const sp=60/tr.bpm/4;
  while(AU.next<AU.ctx.currentTime+.12){const i=AU.step,t=AU.next;
    const L=tr.lead[i%tr.lead.length],Bn=tr.bass[i%tr.bass.length];
    if(L)tone(L,t,sp*1.8,tr.lw,tr.lw==='square'?.05:.09,AU.bgm);if(Bn)tone(Bn,t,sp*1.6,tr.bw,tr.bw==='sawtooth'?.05:.12,AU.bgm);
    const dr=tr.drum;if(dr){const ch=dr[i%dr.length];if(ch==='k')tone(140,t,.12,'sine',.25,AU.bgm,40);else if(ch==='s')noiseHit(t,.1,.12,1500,AU.bgm);else if(ch==='h')noiseHit(t,.03,.05,7000,AU.bgm)}
    AU.step++;AU.next+=sp}}
const SFX={
 blip:()=>tone(520,AU.ctx.currentTime,.04,'square',.04,AU.sfx),
 talk:w=>tone(w==='몽'?900:w==='하루'?640:w==='서윤'?760:430,AU.ctx.currentTime,.03,'square',.025,AU.sfx),
 pick:()=>{const t=AU.ctx.currentTime;tone(660,t,.08,'square',.07,AU.sfx);tone(990,t+.07,.12,'square',.07,AU.sfx)},

  <div style="display:flex;flex-direction:column;gap:8px"><h3>랭킹에 이름 올리기</h3>
   <input type="text" id="nick" maxlength="10" placeholder="닉네임 (10자 이내)" autocomplete="off">
   <button class="btn" data-a="submit">점수 등록</button><p class="small mute" id="subMsg"></p>
   <h3>엔딩 도감</h3><div class="gal">${Object.entries(ENDINGS).map(([k,n])=>`<span class="${lsGet('sow_endings',[]).includes(k)?'on':''}">${lsGet('sow_endings',[]).includes(k)?n:'???'}</span>`).join('')}</div>
   <button class="btn ghost" data-a="again">메인 화면으로 (랭킹 보기)</button></div></div>`);
  on('again',titleScene);on('submit',submitScore)}
let DB=null,UID=null,GLOBAL=[],rankTab='global',boardTimer=null,boardState='loading';
async function initDB(){try{const cl=window.claude;if(!cl||!cl.use){boardState='none';renderBoard();return}
  const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]);if(!db){boardState='none';renderBoard();return}
  DB=db;try{UID=user?await user.id():null}catch(e){UID=null}
  boardTimer=setTimeout(()=>{if(boardState==='loading'){boardState='slow';renderBoard()}},10000);
  DB.collection('scores').orderBy('score','desc').limit(30).onSnapshot(snap=>{GLOBAL=snap.docs.map(d=>({id:d.id,...d.data()}));if(!snap.metadata.fromCache){boardState='ok';clearTimeout(boardTimer)}else if(boardState==='loading')boardState='ok';renderBoard()},err=>{boardState='err';clearTimeout(boardTimer);renderBoard()});
 }catch(e){boardState='none';renderBoard()}}
async function submitScore(){const el=document.getElementById('nick'),msg=document.getElementById('subMsg');const nick=(el.value||'').trim().slice(0,10);
  if(!nick){msg.textContent='닉네임을 입력해 줘.';msg.style.color='var(--bad)';return}
  const row={nick,score:RES.score,ending:RES.t,sleep:+RES.sl.toFixed(1),grade:RES.fin,at:Date.now()};
  const loc=lsGet('sow_rank',[]);loc.push(row);loc.sort((a,b)=>b.score-a.score);lsSet('sow_rank',loc.slice(0,20));
  let ok='이 기기 랭킹에 저장했어.';
  if(DB&&UID){try{const ref=DB.doc('scores/'+UID);const cur=await ref.get();const prev=cur.exists?cur.data():null;
     if(!prev||(prev.score||0)<row.score){await ref.set(row);ok='전체 랭킹에 등록했어!'}else ok=`전체 랭킹에는 예전 최고 기록(${prev.score})이 더 높아서 그대로 뒀어. 이 기기 랭킹엔 저장했어.`;rankTab='global'}
    catch(e){ok='전체 랭킹 등록 권한이 없어서 이 기기 랭킹에만 저장했어.';rankTab='local'}}
  else rankTab='local';
  msg.textContent=ok+' 순위는 메인 화면에서 볼 수 있어.';msg.style.color='var(--good)';sfx('good');document.querySelector('[data-a="submit"]').disabled=true;renderBoard()}
const boardEl=document.getElementById('board');
boardEl.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;rankTab=b.dataset.tab;renderBoard()});
function renderBoard(){const loc=lsGet('sow_rank',[]);const list=rankTab==='global'?GLOBAL:loc;
  const note=rankTab==='global'?(boardState==='none'?'전체 랭킹은 로그인한 사용자만 볼 수 있어. 이 기기 랭킹을 확인해 줘.':boardState==='slow'?'랭킹을 불러오는 중이야. 연결이 느릴 수 있어.':boardState==='err'?'랭킹을 불러오지 못했어.':boardState==='loading'?'불러오는 중…':''):'';
  boardEl.innerHTML=`<div class="row" style="align-items:center;justify-content:space-between"><h3 style="flex:0 1 auto">갓생 랭킹</h3><div class="tabs" style="flex:0 0 auto"><button data-tab="global" aria-pressed="${rankTab==='global'}">전체</button><button data-tab="local" aria-pressed="${rankTab==='local'}">이 기기</button></div></div>
  ${note?`<p class="small mute">${note}</p>`:''}
  ${list.length?`<div style="overflow-x:auto"><table class="rank"><thead><tr><th>#</th><th>닉네임</th><th>엔딩</th><th style="text-align:right">평균 수면</th><th style="text-align:right">성적</th><th style="text-align:right">점수</th></tr></thead><tbody>
  ${list.slice(0,15).map((r,i)=>`<tr class="${rankTab==='global'&&r.id===UID?'me':''}"><td class="pos" style="color:${i===0?'var(--gold)':i<3?'var(--lamp)':'var(--mute)'}">${i+1}</td><td>${esc(r.nick)}</td><td>${esc(r.ending||'')}</td><td class="n">${r.sleep??'-'}h</td><td class="n">${r.grade??'-'}</td><td class="n">${(r.score||0).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`
  :(note&&rankTab==='global'?'':'<p class="small mute">아직 기록이 없어. 첫 번째 갓생러가 되어 봐!</p>')}
  <p class="small mute">갓생 점수 = 최종 성적 × 10 + 평균 수면시간 × 25(8시간까지) + 처치 수 + 미션 성공 × 10. 잠을 줄이면 성적을 올려도 점수가 깎인다.</p>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function titleScene(){const sv=lsGet('sow_save',null);S=fresh();B=null;MG=null;bgm('title');setView({type:'title'});dlg.hidden=true;dq=[];overlay('');boardEl.hidden=false;renderBoard();
  deck(`<p style="font-size:16px">중간고사까지 2주. 매일 밤 10시간을 <b style="color:var(--lamp)">공부</b>, <b style="color:var(--phone)">여가</b>, <b style="color:var(--moon)">잠</b>으로 나누고, 날마다 다른 미니게임과 미션을 넘겨라. 시험 날엔 하루의 머릿속으로 들어가 문제 몬스터와 보스를 쓸어버려야 한다.</p>
  <div class="row">${sv?`<button class="btn" data-a="cont">이어하기 (${sv.phase==='weekend'?'주말':'D'+sv.S.day})</button><button class="btn ghost" data-a="start">처음부터</button>`:'<button class="btn" data-a="start">시작하기 (소리 켜짐)</button>'}</div>
  <p class="small mute">게임 속 수치는 팀 마루가 학생 30명에게 받은 수면 설문 결과로 만들었다. 기획 참고: 「수면의 무게」 덱빌딩 기획서, 「갓생 살아남기」 뱀서라이크 기획서.</p>`);on('start',startGame);
  on('cont',()=>{const v=lsGet('sow_save',null);if(!v)return startGame();setSound(true);boardEl.hidden=true;S=Object.assign(fresh(),v.S);if(v.phase==='weekend')weekendScene();else morningScene()})}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(B&&!B.paused&&!B.lvup){B.paused=true;bhud()}if(MG)MG.paused=true;try{AU.ctx&&AU.ctx.suspend()}catch(e){}}else{if(MG)MG.paused=false;try{AU.on&&AU.ctx&&AU.ctx.resume()}catch(e){}}});
titleScene();initDB();
</script>

</body></html>
